<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        h1, h2, h3, h4, h5, h6 { color: #2c5aa0; margin-top: 30px; }
        h1 { border-bottom: 2px solid #2c5aa0; padding-bottom: 10px; }
        h2 { border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        pre { 
            background-color: #f8f8f8; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            padding: 15px; 
            overflow-x: auto; 
        }
        code { 
            background-color: #f1f1f1; 
            padding: 2px 4px; 
            border-radius: 3px; 
            font-family: Monaco, 'Courier New', monospace; 
        }
        pre code { background-color: transparent; padding: 0; }
        a { color: #2c5aa0; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; background: linear-gradient(135deg, #2c5aa0, #1a4480); color: white; border-radius: 8px; }
        .header h1 { color: white !important; margin-top: 0; border-bottom: none; }
        .nav { margin: 20px 0; padding: 15px; background-color: #f8f9fa; border-radius: 5px; }
        .nav a { margin-right: 20px; font-weight: 500; }
        .content { margin: 20px 0; }
        .footer { text-align: center; margin-top: 40px; padding: 20px; color: #666; border-top: 1px solid #ddd; }
        .highlight-abap { background-color: #e8f4fd; border-left: 4px solid #2c5aa0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>
    </div>
    
    <div class="nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="#advanced-abap">Advanced ABAP</a>
        <a href="#cds--rap">CDS & RAP</a>
        <a href="#interfaces--integration">Integration</a>
        <a href="#quick-start-recipes">Quick Recipes</a>
        <a href="#enhancements">Enhancements</a>
    </div>

    <main class="content">
        {{ content }}
    </main>

    <div class="footer">
        <p>&copy; 2025  Toolkit | Last updated: {{ site.time | date: "%B %d, %Y" }}</p>
        
    </div>
</body>
</html>

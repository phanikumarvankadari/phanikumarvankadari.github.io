title: Code Repository
description: Comprehensive SAP programming notes, examples, and best practices for SAP developers
baseurl: ""
url: "https://phanikumarvankadari.github.io"

# Build settings
markdown: kramdown
highlighter: rouge

# Basic plugins only
plugins:
  - jekyll-feed

# Exclude files from processing
exclude:
  - REPOSITORY.md
  - sync-docs.sh
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - .sass-cache/
  - .jekyll-cache/
  - vendor/
  - .DS_Store